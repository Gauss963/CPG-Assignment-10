name: macOS Flang CI and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LLVM Flang
        run: brew install flang

      - name: Build Fortran executables and PGPLOT bundle
        run: bash .github/scripts/build-macos.sh

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download macOS release assets
        uses: actions/download-artifact@v4
        with:
          name: macos-release-assets
          path: ${{ runner.temp }}/release-assets

      - name: Create or update v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$GITHUB_REPOSITORY $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" "$RUNNER_TEMP"/release-assets/* --clobber
